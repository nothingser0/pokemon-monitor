# ============================================================
# Pokemon GO Coordinate Monitor - Docker Compose
# ============================================================
# Usage:
#   docker compose up -d --build
#   docker compose logs -f
#   docker compose down
#
# Credentials (WEBHOOK_URL, BEARER_TOKEN) are loaded from .env
# (docker compose automatically reads .env in this directory for
#  variable substitution, and env_file passes it into the container.)

services:
  pokemon-monitor:
    build: .
    container_name: pokemon-monitor
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # State file lives in the mounted volume so it persists across restarts
      STATE_FILE: /app/data/.state.json
      TZ: Asia/Jakarta
    volumes:
      # Filter/payload config (read-only mount)
      - ./config.json:/app/config.json:ro
      # Persistent state (notified Pokemon IDs)
      - ./data:/app/data
