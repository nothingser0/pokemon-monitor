# ============================================================
# Pokemon GO Coordinate Monitor - Docker Compose
# ============================================================
# Usage:
#   docker compose pull && docker compose up -d    (pakai image dari GHCR)
# Atau build sendiri:
#   docker compose up -d --build

services:
  pokemon-monitor:
    image: ghcr.io/nothingser0/pokemon-monitor:latest
    build: .
    container_name: pokemon-monitor
    restart: unless-stopped
    env_file:
      - .env
    environment:
      STATE_FILE: /app/data/.state.json
      TZ: Asia/Jakarta
    volumes:
      # Filter/payload config
      - ./config.json:/app/config.json:ro
      # Persistent state (ID pokemon yang sudah dinotifikasi)
      - ./data:/app/data
